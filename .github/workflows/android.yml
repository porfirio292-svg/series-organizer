name: Android APK
on:
  push:
    branches: [ main, v1.3-kodi-series-file-organizer ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Prepare named APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Kodi_Series_File_Organizer_v1.3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kodi_Series_File_Organizer_v1.3
          path: release/Kodi_Series_File_Organizer_v1.3.apk
          if-no-files-found: error
